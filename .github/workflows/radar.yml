name: varredura
# Horários: 09h, 14h e 20h de Brasília (12h, 17h e 23h UTC).
# O agendamento do GitHub atrasa horas, então quem dispara no horário é o Mac
# (scraper/agendador: `gh workflow run radar.yml -f agendada=true`). O cron daqui
# é reserva: roda de hora em hora e só varre se o horário mais recente ainda
# não teve varredura. Disparo manual (Run workflow ou o botão VARRER AGORA da página) sempre varre.
#
# A conferência "horário já varrido?" roda num job separado, fora do grupo de concorrência:
# assim as reservas que não vão varrer não entram na fila (no GitHub, um run novo na fila
# cancela o que estava esperando — era assim que um pedido do botão podia sumir).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      agendada:
        description: 'Pular se este horário já foi varrido'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  trava:
    runs-on: ubuntu-latest
    outputs:
      pular: ${{ steps.trava.outputs.pular }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - id: trava
        if: github.event_name == 'schedule' || inputs.agendada
        run: python3 .github/trava.py docs/data/listings.json >> "$GITHUB_OUTPUT"
  varredura:
    needs: trava
    if: needs.trava.outputs.pular != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency: varredura
    steps:
      # ref: main = o estado mais novo quando o job começa (não o de quando foi disparado):
      # quem esperou outra varredura terminar parte dos dados dela e não dá conflito no push
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Horário já varrido? (outra varredura pode ter rodado enquanto este esperava)
        id: trava
        if: github.event_name == 'schedule' || inputs.agendada
        run: python3 .github/trava.py docs/data/listings.json >> "$GITHUB_OUTPUT"
      - if: steps.trava.outputs.pular != 'true'
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - if: steps.trava.outputs.pular != 'true'
        run: pip install curl_cffi==0.13.0
      - if: steps.trava.outputs.pular != 'true'
        run: python scraper/radar.py
      # Salva mesmo se algum perfil falhou (os outros perfis e o geocache não se perdem)
      - name: Salvar dados
        if: ${{ !cancelled() && steps.trava.outputs.pular != 'true' }}
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Varredura $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
