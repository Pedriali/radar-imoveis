name: varredura
# Horários: 09h, 14h e 20h de Brasília (12h, 17h e 23h UTC).
#
# Onde roda: Zap e OLX bloqueiam (HTTP 403) os IPs dos servidores do GitHub, então a varredura roda no
# Mac (runner próprio com o rótulo radar-mac, IP residencial). O Mac dispara no horário
# (scraper/agendador: `gh workflow run radar.yml -f agendada=true`); o botão VARRER AGORA também vai
# para o Mac. O cron daqui é a reserva na nuvem (ubuntu-latest): roda de hora em hora e só varre se o
# horário mais recente ainda não teve varredura (Mac desligado ou dormindo).
#
# A conferência "horário já varrido?" roda num job separado, fora do grupo de concorrência:
# assim as reservas que não vão varrer não entram na fila (no GitHub, um run novo na fila
# cancela o que estava esperando — era assim que um pedido do botão podia sumir).
# Pedido preso esperando o Mac há mais de 20 min é cancelado pela reserva (.github/destrava.py).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      agendada:
        description: 'Pular se este horário já foi varrido'
        type: boolean
        default: false
jobs:
  trava:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      pular: ${{ steps.trava.outputs.pular }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - id: trava
        if: github.event_name == 'schedule' || inputs.agendada
        run: python3 .github/trava.py docs/data/listings.json >> "$GITHUB_OUTPUT"
      - name: Pedidos presos esperando o Mac
        if: github.event_name == 'schedule' && steps.trava.outputs.pular != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/destrava.py
  varredura:
    needs: trava
    if: needs.trava.outputs.pular != 'true'
    # reserva (cron) na nuvem; pedidos do Mac e do botão no Mac
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-latest' || 'radar-mac' }}
    permissions:
      contents: write
    timeout-minutes: 90
    concurrency: varredura
    steps:
      # ref: main = o estado mais novo quando o job começa (não o de quando foi disparado):
      # quem esperou outra varredura terminar parte dos dados dela e não dá conflito no push
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Horário já varrido? (outra varredura pode ter rodado enquanto este esperava)
        id: trava
        if: github.event_name == 'schedule' || inputs.agendada
        run: python3 .github/trava.py docs/data/listings.json >> "$GITHUB_OUTPUT"
      - if: steps.trava.outputs.pular != 'true' && runner.os != 'macOS'
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - if: steps.trava.outputs.pular != 'true' && runner.os != 'macOS'
        run: pip install curl_cffi==0.13.0
      # No Mac: venv fixo com o Python do sistema (3.9) — radar.py precisa continuar compatível com ele
      - name: Python do Mac
        if: steps.trava.outputs.pular != 'true' && runner.os == 'macOS'
        run: |
          [ -x "$HOME/.radar-venv/bin/python" ] || /usr/bin/python3 -m venv "$HOME/.radar-venv"
          "$HOME/.radar-venv/bin/pip" install -q --disable-pip-version-check curl_cffi==0.13.0
          echo "$HOME/.radar-venv/bin" >> "$GITHUB_PATH"
      - if: steps.trava.outputs.pular != 'true'
        run: python scraper/radar.py
      # Salva mesmo se algum perfil falhou (os outros perfis e o geocache não se perdem)
      - name: Salvar dados
        if: ${{ !cancelled() && steps.trava.outputs.pular != 'true' }}
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Varredura $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
